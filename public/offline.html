<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090d" />
    <title>Mayoi · Offline</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        background: radial-gradient(900px 500px at 50% -10%, rgba(106, 64, 224, 0.22), transparent 60%), #09090d;
        color: #ececf3; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
      }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { margin: 16px 0 6px; font-size: 24px; }
      p { margin: 0 0 20px; color: #9a9aab; }
      button {
        height: 44px; padding: 0 22px; border: 0; border-radius: 10px; font: 700 15px system-ui, sans-serif; color: #fff;
        background: linear-gradient(135deg, #d03a73, #6a40e0); cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Mayoi needs a connection. Check your internet and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
